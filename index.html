<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sirius天狼</title>
    <style>
        /* 自定义字体 NanoTikBazHei-Bold */
        @font-face {
            font-family: 'NanoTikBazHei';
            src: url('NanoTikBazHei-Bold.ttf') format('truetype');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #282828;
            --surface: #1e1e1e;
            --surface-elevated: #2e2e2e;
            --accent-glow: #a0c8e8;
            --text-primary: #f0f4fa;
            --text-secondary: #b0bec5;
            --shadow-diffuse: 0 18px 30px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            --squircle-radius: 28px;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-deep);
            font-family: 'NanoTikBazHei', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-weight: bold;
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* 鼠标轨迹画布 — 最高图层 */
        #trail-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* ========== 顶部悬浮模块：头像（左上） ========== */
        .top-avatar-module {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 100;
            width: 68px;
            height: 68px;
            border-radius: 22px;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(16px) saturate(200%);
            -webkit-backdrop-filter: blur(16px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(160, 200, 232, 0.1) inset;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top-avatar-module img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ========== 顶部悬浮模块：名字（右上） ========== */
        .top-name-module {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            padding: 18px 28px;
            border-radius: 22px;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(16px) saturate(200%);
            -webkit-backdrop-filter: blur(16px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(160, 200, 232, 0.1) inset;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .top-name-module .top-name {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff, #b8d4f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 12px rgba(160, 200, 232, 0.3);
            white-space: nowrap;
            line-height: 1.2;
        }

        .top-name-module .artist-title {
            font-size: 0.8rem;
            color: var(--text-secondary);
            letter-spacing: 0.4px;
            font-weight: bold;
            text-align: right;
        }

        /* 底部固定栏 */
        .bottom-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            z-index: 100;
            padding: 16px 24px;
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            border-radius: var(--squircle-radius);
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(16px) saturate(200%);
            -webkit-backdrop-filter: blur(16px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 -8px 28px -8px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(160, 200, 232, 0.08) inset;
            color: var(--text-secondary);
            font-weight: bold;
        }

        /* ========== 首屏个人介绍区域（无背景卡片，滚动淡入简介） ========== */
        .hero-section {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 140px 24px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .hero-avatar {
            width: 240px;
            height: 240px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(160, 200, 232, 0.15) inset;
            margin-bottom: 24px;
            transition: transform 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-name {
            font-size: 2.6rem;
            font-weight: bold;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #ffffff, #b8d4f0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 24px rgba(160, 200, 232, 0.35);
            margin-bottom: 8px;
        }

        .hero-sub {
            font-size: 1rem;
            color: var(--text-secondary);
            letter-spacing: 2px;
            margin-bottom: 0;
        }

        /* 简介文字：默认隐藏，向下滑动后淡入 */
        .hero-bio {
            max-width: 720px;
            margin-top: 0;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transform: translateY(20px);
            transition: opacity 1s ease, max-height 1s cubic-bezier(0.2, 0.9, 0.3, 1), transform 1s cubic-bezier(0.2, 0.9, 0.3, 1);
            color: var(--text-primary);
            line-height: 1.9;
            font-size: 1.05rem;
        }

        .hero-bio.revealed {
            opacity: 1;
            max-height: 500px;
            transform: translateY(0);
            margin-top: 36px;
        }

        .hero-bio p {
            margin-bottom: 14px;
        }

        .hero-bio p:last-child {
            margin-bottom: 0;
        }

        /* 下方内容区域 */
        .main-content {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 24px 100px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            z-index: 10;
            position: relative;
        }

        /* 入场动画 */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.3, 1), transform 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .module-card {
            background: rgba(30, 30, 30, 0.78);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--squircle-radius);
            padding: 28px 32px;
            box-shadow: var(--shadow-diffuse);
            transition: box-shadow 0.3s ease, transform 0.2s ease;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .module-title-centered {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .module-title-centered .title-text {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
            color: var(--accent-glow);
            white-space: nowrap;
        }

        .module-title-centered .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(160, 200, 232, 0.5), transparent);
            min-width: 30px;
        }

        /* 业务网格 */
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-top: 12px;
        }

        .service-item {
            background: rgba(38, 38, 38, 0.7);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.8);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .service-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 28px -10px rgba(0, 0, 0, 0.9);
        }

        .service-image {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #2a2a2a;
            overflow: hidden;
            position: relative;
        }

        .service-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .service-item:hover .service-image img {
            transform: scale(1.03);
        }

        .service-label {
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* 价格列表 */
        .price-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 6px;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px dashed rgba(160, 200, 232, 0.15);
        }

        .price-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #2a2a2a;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.7);
        }

        .price-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .price-info {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .price-label {
            font-size: 1.05rem;
            color: var(--text-primary);
            font-weight: bold;
        }

        .price-value {
            font-weight: bold;
            color: var(--accent-glow);
            font-size: 1.1rem;
        }

        .price-note {
            margin-top: 18px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: bold;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .top-avatar-module {
                top: 10px;
                left: 10px;
                width: 56px;
                height: 56px;
                border-radius: 18px;
            }

            .top-name-module {
                top: 10px;
                right: 10px;
                padding: 12px 18px;
                border-radius: 18px;
            }

            .top-name-module .top-name {
                font-size: 1.15rem;
            }

            .top-name-module .artist-title {
                font-size: 0.7rem;
            }

            .bottom-bar {
                padding: 12px 18px;
                font-size: 0.8rem;
                bottom: 10px;
                left: 10px;
                right: 10px;
            }

            .hero-section {
                padding: 110px 16px 40px;
            }

            .hero-avatar {
                width: 100px;
                height: 100px;
                border-radius: 30px;
            }

            .hero-name {
                font-size: 2rem;
            }

            .hero-sub {
                font-size: 0.85rem;
                letter-spacing: 1.5px;
            }

            .hero-bio {
                font-size: 0.95rem;
                line-height: 1.8;
            }

            .main-content {
                padding: 10px 16px 82px;
                gap: 18px;
            }

            .module-card {
                padding: 22px 20px;
                border-radius: 24px;
            }

            .module-title-centered .title-text {
                font-size: 0.95rem;
                letter-spacing: 2px;
            }

            .service-grid {
                grid-template-columns: 1fr;
            }

            .price-row {
                gap: 14px;
            }

            .price-icon {
                width: 48px;
                height: 48px;
                border-radius: 14px;
            }

            .price-label {
                font-size: 0.95rem;
            }

            .price-value {
                font-size: 1rem;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5a5a5a;
        }

        .module-card:hover {
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 1), 0 0 0 1px rgba(160, 200, 232, 0.15) inset;
        }
    </style>
</head>
<body>
    <!-- 鼠标轨迹画布：最高图层 -->

    <!-- 左上角头像悬浮模块（独立） -->

    <script>
        (function() {
            // ========== 线性渐变深蓝色轨迹（最高图层） ==========
            const canvas = document.getElementById('trail-canvas');
            const ctx = canvas.getContext('2d');
            const points = [];
            const MAX_AGE = 55;
            const MAX_POINTS = 22;
            let mouseX = -1000, mouseY = -1000;
            let lastX = null, lastY = null;
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

            function resizeCanvas() {
                const dpr = window.devicePixelRatio || 1;
                const w = window.innerWidth;
                const h = window.innerHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.clearRect(0, 0, w, h);
                points.length = 0;
                lastX = lastY = null;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            function addPoint(x, y) {
                if (lastX !== null && lastY !== null) {
                    const dx = x - lastX;
                    const dy = y - lastY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 3) return;
                }
                points.push({ x, y, age: 0 });
                if (points.length > MAX_POINTS) points.shift();
                lastX = x;
                lastY = y;
            }

            function updateMousePosition(e) {
                if (e.touches) {
                    const touch = e.touches[0];
                    if (!touch) return;
                    mouseX = touch.clientX;
                    mouseY = touch.clientY;
                } else {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                }
                addPoint(mouseX, mouseY);
                updateCardShadows(mouseX, mouseY);
            }

            function drawTrail() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                ctx.clearRect(0, 0, w, h);

                if (points.length < 2) {
                    for (let i = 0; i < points.length; i++) points[i].age++;
                    while (points.length > 0 && points[0].age > MAX_AGE) points.shift();
                    requestAnimationFrame(drawTrail);
                    return;
                }

                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];

                    const ratio1 = i / points.length;
                    const ratio2 = (i + 1) / points.length;
                    const avgAge = (p1.age + p2.age) / 2;
                    const ageFactor = Math.max(0, 1 - avgAge / MAX_AGE);

                    const alpha1 = ratio1 * 0.45 * ageFactor;
                    const alpha2 = ratio2 * 0.45 * ageFactor;

                    const gradient = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
                    gradient.addColorStop(0, `rgba(26, 43, 74, ${alpha1})`);
                    gradient.addColorStop(1, `rgba(42, 74, 122, ${alpha2})`);

                    const lineWidth = 4.5 * (0.5 + ratio2 * 0.8) * (0.6 + ageFactor * 0.6);

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = lineWidth;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();
                }

                const latest = points[points.length - 1];
                if (latest && latest.age < MAX_AGE) {
                    const glowSize = 22 * (1 - latest.age / MAX_AGE);
                    const gradient = ctx.createRadialGradient(latest.x, latest.y, 0, latest.x, latest.y, glowSize);
                    gradient.addColorStop(0, `rgba(42, 90, 150, ${0.35 * (1 - latest.age / MAX_AGE)})`);
                    gradient.addColorStop(0.6, `rgba(26, 58, 110, ${0.18 * (1 - latest.age / MAX_AGE)})`);
                    gradient.addColorStop(1, 'rgba(10, 30, 60, 0)');
                    ctx.beginPath();
                    ctx.arc(latest.x, latest.y, glowSize, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();
                }

                for (let i = 0; i < points.length; i++) points[i].age++;
                while (points.length > 0 && points[0].age > MAX_AGE) points.shift();

                requestAnimationFrame(drawTrail);
            }

            drawTrail();

            // ========== 卡片阴影动态效果 ==========
            const cards = document.querySelectorAll('.module-card, .top-avatar-module, .top-name-module, .bottom-bar');

            function updateCardShadows(mx, my) {
                cards.forEach(card => {
                    const rect = card.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const deltaX = (mx - centerX) / rect.width;
                    const deltaY = (my - centerY) / rect.height;
                    const offsetX = Math.max(-0.3, Math.min(0.3, deltaX)) * 20;
                    const offsetY = Math.max(-0.3, Math.min(0.3, deltaY)) * 20;
                    const baseShadow = `0 18px 30px -12px rgba(0, 0, 0, 0.8)`;
                    const dynamicShadow = `0 ${8 + offsetY}px ${30 + Math.abs(offsetX)}px -12px rgba(0, 0, 0, 0.95)`;
                    const glow = `0 0 0 1px rgba(160, 200, 232, ${0.08 + Math.abs(offsetX) * 0.01}) inset`;
                    card.style.boxShadow = `${baseShadow}, ${dynamicShadow}, ${glow}`;
                });
            }

            function resetCardShadows() {
                cards.forEach(card => {
                    card.style.boxShadow = 'var(--shadow-diffuse)';
                });
            }

            window.addEventListener('mousemove', (e) => {
                if (!isTouchDevice) updateMousePosition(e);
            });
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length) updateMousePosition(e);
            }, { passive: true });
            window.addEventListener('touchstart', (e) => {
                if (e.touches.length) updateMousePosition(e);
            }, { passive: true });
            window.addEventListener('mouseleave', resetCardShadows);
            window.addEventListener('blur', resetCardShadows);

            // ========== 首屏简介：向下滑动淡入 ==========
            const heroBio = document.getElementById('heroBio');
            let bioRevealed = false;

            function checkBioReveal() {
                if (bioRevealed || !heroBio) return;
                const scrollY = window.scrollY || window.pageYOffset;
                if (scrollY > 120) {
                    heroBio.classList.add('revealed');
                    bioRevealed = true;
                }
            }

            window.addEventListener('scroll', checkBioReveal, { passive: true });
            window.addEventListener('load', checkBioReveal);

            // ========== 下方模块滚动入场动画 ==========
            const animateElements = document.querySelectorAll('.animate-on-scroll');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, {
                threshold: 0.15,
                rootMargin: '0px 0px -40px 0px'
            });

            animateElements.forEach(el => observer.observe(el));

            window.addEventListener('load', () => {
                animateElements.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.top < window.innerHeight * 0.9 && rect.bottom > 0) {
                        el.classList.add('visible');
                    }
                });
            });

            resetCardShadows();
        })();
    </script>
</body>
</html>
